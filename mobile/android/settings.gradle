pluginManagement {
  def nodeCommand = System.getenv("NODE_BINARY") ?: ["/opt/homebrew/bin/node", "/usr/local/bin/node", "node"].find { candidate ->
    candidate == "node" || new File(candidate).canExecute()
  } ?: "node"
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeCommand, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

}

plugins {
  id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand()
  }
}

rootProject.name = 'Bengali Wallet'


include ':app'
