<!DOCTYPE html>
<html>
<head>
    <title>Toll Payment Banner</title>
</head>
<body>
    <canvas id="canvas" width="1200" height="300"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Background gradient - Road/Highway theme
        const gradient = ctx.createLinearGradient(0, 0, 1200, 300);
        gradient.addColorStop(0, '#1a472a');
        gradient.addColorStop(1, '#2d5a3d');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1200, 300);
        
        // Road lines
        ctx.strokeStyle = '#f4d03f';
        ctx.lineWidth = 3;
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(0, 150);
        ctx.lineTo(1200, 150);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Title
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 72px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('Toll Payment', 60, 110);
        
        // Subtitle
        ctx.fillStyle = '#f4d03f';
        ctx.font = '32px Arial';
        ctx.fillText('Quick & Easy Highway Tolls', 60, 170);
        
        // Road icon - simple car
        ctx.fillStyle = '#ff6b6b';
        ctx.fillRect(900, 80, 120, 60);
        ctx.fillRect(920, 60, 30, 25);
        ctx.fillRect(970, 60, 30, 25);
        
        // Download canvas as image
        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'toll-banner.jpeg';
            a.click();
        }, 'image/jpeg', 0.95);
    </script>
</body>
</html>
