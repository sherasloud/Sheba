<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#roadGradient)"/>
  
  <!-- Road lines -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#f4d03f" stroke-width="4" stroke-dasharray="20,20"/>
  
  <!-- Title -->
  <text x="60" y="110" font-size="72" font-weight="bold" fill="#ffffff" font-family="Arial">Toll Payment</text>
  
  <!-- Subtitle -->
  <text x="60" y="170" font-size="32" fill="#f4d03f" font-family="Arial">Quick & Easy Highway Tolls</text>
  
  <!-- Car icon -->
  <rect x="900" y="80" width="120" height="60" fill="#ff6b6b" rx="5"/>
  <rect x="920" y="60" width="30" height="25" fill="#333" rx="3"/>
  <rect x="970" y="60" width="30" height="25" fill="#333" rx="3"/>
  <circle cx="915" cy="145" r="8" fill="#333"/>
  <circle cx="1005" cy="145" r="8" fill="#333"/>
</svg>
